name: Deploy to GitHub Pages

'on':
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Installa convertitore WebP
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y webp

      - name: Prepara il sito per il deploy
        run: |
          set -euo pipefail
          python3 scripts/prepare_deploy.py

      - name: Verifica staging
        run: |
          set -euo pipefail
          test -d ./_site
          test -f ./_site/index.html
          remaining=$(find ./_site -type f \( -iname '*.avif' -o -iname '*.bmp' -o -iname '*.gif' -o -iname '*.heic' -o -iname '*.heif' -o -iname '*.ico' -o -iname '*.jpeg' -o -iname '*.jpg' -o -iname '*.png' -o -iname '*.svg' -o -iname '*.tif' -o -iname '*.tiff' \) | sed 's#^./_site/##')
          if [ -n "${remaining}" ]; then
            echo "${remaining}"
            echo 'Sono rimaste immagini non WebP o immagini non previste nello staging.'
            exit 1
          fi

      - name: Report immagini pubblicate
        run: |
          set -euo pipefail
          echo 'Elenco immagini WebP presenti nello staging (_site):'
          webp_count=$(find ./_site -type f -name '*.webp' | wc -l | tr -d ' ')
          echo "Totale immagini WebP: ${webp_count}"
          find ./_site -type f -name '*.webp' | sed 's#^./_site/##' | sort

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
